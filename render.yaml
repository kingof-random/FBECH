services:
  - type: web
    name: fbech-ferox
    runtime: python
    plan: starter
    region: singapore
    branch: feature/auth-render-deployment
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: fbech-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FBECH_DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: FBECH_ADMIN_USERNAME
        sync: false
      - key: FBECH_ADMIN_PASSWORD
        sync: false
