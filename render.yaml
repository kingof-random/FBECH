services:
  - type: web
    name: fbech-ferox
    runtime: python
    plan: free
    region: singapore
    branch: feature/auth-render-deployment
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: FBECH_ADMIN_USERNAME
        sync: false
      - key: FBECH_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: "https://secbzjldxmvrbviilyma.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FBECH_BUCKET
        value: "fbech-evidence"
